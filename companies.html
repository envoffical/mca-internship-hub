<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Experiences - MCA Internship Hub</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Premium Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Animation Overlay -->
  <div id="page-loader" class="page-loader">
    <div class="spinner-crimson" role="status"></div>
  </div>

  <!-- Shared Dynamic Header Navbar -->
  <header id="navbar-container"></header>

  <!-- Main Content Area -->
  <main class="py-5" style="margin-top: 80px;">
    <div class="container">
      
      <!-- Top Title Bar -->
      <div class="text-center mb-5">
        <span class="badge badge-custom badge-crimson mb-2">Alumni Reviews</span>
        <h1 class="fw-bold text-dark">Internship Experience Boards</h1>
        <p class="text-muted mx-auto" style="max-width: 600px;">
          Filter through historical placements, interview hurdles, and stipend levels to find the perfect blueprint for your placement journey.
        </p>
      </div>

      <!-- Search & Filter Console -->
      <div class="glass-card p-4 mb-5 border-light">
        <div class="row g-3">
          <!-- Company Name Search -->
          <div class="col-md-4">
            <label class="form-label small fw-bold text-dark" for="search-company">
              <i class="fas fa-building text-crimson me-1"></i>Search by Company
            </label>
            <input type="text" id="search-company" class="form-control search-control" placeholder="e.g. Google, TCS, Adobe...">
          </div>
          <!-- Role Search -->
          <div class="col-md-4">
            <label class="form-label small fw-bold text-dark" for="search-role">
              <i class="fas fa-user-tag text-crimson me-1"></i>Search by Role
            </label>
            <input type="text" id="search-role" class="form-control search-control" placeholder="e.g. Frontend, Backend, SDE...">
          </div>
          <!-- Location Search -->
          <div class="col-md-4">
            <label class="form-label small fw-bold text-dark" for="search-location">
              <i class="fas fa-map-marker-alt text-crimson me-1"></i>Search by Location
            </label>
            <input type="text" id="search-location" class="form-control search-control" placeholder="e.g. Pune, Bangalore, Remote...">
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-light">
          <span class="small text-muted" id="results-counter">Found 0 experiences</span>
          <button class="btn btn-crimson-outline btn-sm rounded-pill px-3" id="btn-reset-filters">
            <i class="fas fa-redo me-1"></i>Clear Filters
          </button>
        </div>
      </div>

      <!-- Experiences Grid Container -->
      <div class="row g-4" id="companies-deck-container">
        <!-- Dynamically populated cards by js/companies.js -->
        <div class="col-12 text-center py-5" id="loader-placeholder">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading data...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Shared Dynamic Footer -->
  <footer id="footer-container"></footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Offline Database Fallback -->
  <script src="data/internships.js"></script>
  
  <!-- Global Core Application Code -->
  <script src="js/app.js"></script>
  
  <!-- Page Specific Execution Script -->
  <script src="js/companies.js"></script>
</body>
</html>
