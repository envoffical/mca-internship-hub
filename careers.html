<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers Directory - MCA Internship Hub</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Premium Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Animation Overlay -->
  <div id="page-loader" class="page-loader">
    <div class="spinner-crimson" role="status"></div>
  </div>

  <!-- Shared Dynamic Header Navbar -->
  <header id="navbar-container"></header>

  <!-- Main Content Area -->
  <main class="py-5" style="margin-top: 80px;">
    <div class="container">
      
      <!-- Top Title Bar -->
      <div class="text-center mb-5">
        <span class="badge badge-custom badge-crimson mb-2">Job Portals & Tech Hubs</span>
        <h1 class="fw-bold text-dark">Placement & Career Directories</h1>
        <p class="text-muted mx-auto" style="max-width: 650px;">
          A curated directory of major IT parks, digital ecosystems, and high-growth corporations. Use these pre-linked portals or pre-configured searches to streamline your job applications.
        </p>
      </div>

      <!-- Search & Filter Console -->
      <div class="glass-card p-4 mb-5 border-light">
        <div class="row g-3">
          <!-- Text Search -->
          <div class="col-md-6 col-lg-4">
            <label class="form-label small fw-bold text-dark" for="search-text">
              <i class="fas fa-search text-crimson me-1"></i>Search Hub or Tech
            </label>
            <input type="text" id="search-text" class="form-control search-control" placeholder="Search by name, stack, audience...">
          </div>
          <!-- Region Filter -->
          <div class="col-md-6 col-lg-4">
            <label class="form-label small fw-bold text-dark" for="filter-region">
              <i class="fas fa-map-marker-alt text-crimson me-1"></i>State / Hub Region
            </label>
            <select id="filter-region" class="form-select search-control">
              <option value="">All Regions</option>
            </select>
          </div>
          <!-- Type Filter -->
          <div class="col-md-12 col-lg-4">
            <label class="form-label small fw-bold text-dark" for="filter-type">
              <i class="fas fa-building text-crimson me-1"></i>Hub / Company Type
            </label>
            <select id="filter-type" class="form-select search-control">
              <option value="">All Hub Types</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-light">
          <span class="small text-muted" id="results-counter">Found 0 career directories</span>
          <button class="btn btn-crimson-outline btn-sm rounded-pill px-3" id="btn-reset-filters">
            <i class="fas fa-redo me-1"></i>Clear Filters
          </button>
        </div>
      </div>

      <!-- Careers Grid Container -->
      <div class="row g-4" id="careers-deck-container">
        <!-- Dynamically populated cards by js/careers.js -->
        <div class="col-12 text-center py-5" id="loader-placeholder">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading career hubs...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Shared Dynamic Footer -->
  <footer id="footer-container"></footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Offline Database Fallback -->
  <script src="data/careers.js"></script>
  
  <!-- Global Core Application Code -->
  <script src="js/app.js"></script>
  
  <!-- Page Specific Execution Script -->
  <script src="js/careers.js"></script>
</body>
</html>
