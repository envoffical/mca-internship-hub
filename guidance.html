<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect with Alumni Mentors - MCA Internship Hub</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Premium Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Animation Overlay -->
  <div id="page-loader" class="page-loader">
    <div class="spinner-crimson" role="status"></div>
  </div>

  <!-- Shared Dynamic Header Navbar -->
  <header id="navbar-container"></header>

  <!-- Main Content Area -->
  <main class="py-5" style="margin-top: 80px;">
    <div class="container">
      
      <!-- Top Title Bar -->
      <div class="text-center mb-5">
        <span class="badge badge-custom badge-crimson mb-2">Connect & Learn</span>
        <h1 class="fw-bold text-dark">Alumni Mentorship Network</h1>
        <p class="text-muted mx-auto" style="max-width: 600px;">
          Reach out to senior graduates who have successfully transitioned to corporate roles. Get 1-on-1 feedback on resumes, prep routines, and tech careers.
        </p>
      </div>

      <!-- Quick Search / Filter Console -->
      <div class="glass-card p-4 mb-5 border-light">
        <div class="row g-3 align-items-center justify-content-between">
          <div class="col-md-6 col-lg-5">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 border-light ps-3 pe-0" style="border-radius: 12px 0 0 12px;">
                <i class="fas fa-search text-muted"></i>
              </span>
              <input type="text" id="mentor-search" class="form-control search-control border-start-0 ps-2" placeholder="Search by Company or Graduation Batch..." style="border-radius: 0 12px 12px 0;">
            </div>
          </div>
          <div class="col-md-5 col-lg-4 text-md-end text-center mt-3 mt-md-0">
            <span class="badge-custom badge-crimson px-3 py-2" id="mentors-counter">0 Active Community Mentors</span>
          </div>
        </div>
      </div>

      <!-- Mentors Grid -->
      <div class="row g-4" id="mentors-deck-container">
        <!-- Dynamically populated profile cards by js/guidance.js -->
        <div class="col-12 text-center py-5" id="loader-placeholder">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Syncing alumni records...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Shared Dynamic Footer -->
  <footer id="footer-container"></footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Offline Database Fallback -->
  <script src="data/internships.js"></script>
  
  <!-- Global Core Application Code -->
  <script src="js/app.js"></script>
  
  <!-- Page Specific Execution Script -->
  <script src="js/guidance.js"></script>
</body>
</html>
